- name: app setup
  ansible.builtin.import_role:
   name: common
   tasks_from: app-setup.yaml

- name: app setup
  ansible.builtin.import_role:
   name: common
   tasks_from: java-setup.yaml   

- name: app setup
  ansible.builtin.import_role:
   name: common
   tasks_from: syatemd-setup.yaml    

- name: install dependences
  ansible.builtin.pip:
    name: PyMySQL
    executable: pip3.9   

- name: import shipping data
  community.mysql.mysql_db:
    state: import
    name: all
    login_host: "{{ MYSQL_HOST }}"
    login_user: root
    login_password: RoboShop@1
    target: "{{ item }}"
  loop:
  - /app/db/schema.sql
  - /app/db/app-user.sql    
  - /app/db/master-data.sql

- name: start and enabled shipping
  ansible.builtin.service:
    name: shipping
    state: started
    enabled: yes      


